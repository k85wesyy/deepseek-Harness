- insert:
    - id: net
      name: '@local/dsh-net'
      config:
        # 下载目录。留空 = <工作目录>/downloads
        downloadDir: ''
        # GitHub personal access token（可选）。有 token 才解锁代码搜索，并提高匿名限流。
        # ★不用写在这里 —— 用 net_keystore 工具 set github <token>，会落到 net-keystore.json
        token: ''
        # 单次请求超时（毫秒）
        timeoutMs: 20000
        # 是否对搜索结果去噪（屏蔽黑名单域名 + 丢弃与查询词零匹配的结果）
        # 设 false 可关掉，拿到搜索引擎原样返回的全部结果
        denoise: true
        # 额外的黑名单域名；留空则用插件内置的默认表
        # （百度百科/知乎/网易云音乐/东方财富/抖音/豆瓣/微博 等）
        blockedDomains: []
